name: CD — Docker Hub y EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      mode:
        description: Modo de ejecución
        type: choice
        options: [build, publish, deploy]
        default: build

permissions:
  contents: read

concurrency:
  group: inventario-cd
  cancel-in-progress: false

env:
  IMAGE: manumorita/api-inventario
  REMOTE_SCRIPT: |
    #!/usr/bin/env bash
    set -euo pipefail

    image=${1:?Falta la referencia de imagen}
    compose_sha=${2:?Falta la suma SHA-256 de Compose}
    [[ "$image" =~ ^manumorita/api-inventario@sha256:[a-f0-9]{64}$ ]]
    [[ "$compose_sha" =~ ^[a-f0-9]{64}$ ]]

    cd /home/ubuntu/despliegue
    exec 9>.inventario-deploy.lock
    flock -n 9 || { echo 'Hay otro despliegue en curso.' >&2; exit 1; }

    compose_file=docker-compose.aws.yml
    printf '%s  %s\n' "$compose_sha" "$compose_file" | sha256sum -c -
    export DOCKER_IMAGE="$image"
    compose=(docker compose --env-file .env -f "$compose_file")

    # Valida el puerto sin mostrar credenciales.
    "${compose[@]}" config --format json | jq -e '
        .services.backend.ports | any(.published == "8080" and .target == 8080)
    ' >/dev/null
    db_id=$("${compose[@]}" ps -q db)
    if [[ -z "$db_id" ]] || [[ "$(docker inspect --format '{{.State.Health.Status}}' "$db_id")" != healthy ]]; then
        echo 'PostgreSQL debe estar en ejecución y saludable antes de actualizar.' >&2
        exit 1
    fi

    backend_id=$("${compose[@]}" ps --all --quiet backend)
    if [[ -n "$backend_id" ]]; then
        docker inspect --format 'Backend anterior: {{.Config.Image}} ({{.Image}})' "$backend_id"
    fi
    df -h
    docker system df

    # Prepara el digest que se guardará después del healthcheck.
    umask 077
    temp_env=$(mktemp .inventario-image.XXXXXXXX)
    trap 'rm -f "$temp_env"' EXIT
    printf 'DOCKER_IMAGE=%s\n' "$image" > "$temp_env"

    "${compose[@]}" pull backend
    "${compose[@]}" up -d --no-deps --no-build --pull never --wait --wait-timeout 180 backend
    curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8080/actuator/health |
        jq -e '.status == "UP"' >/dev/null

    mv -f -- "$temp_env" .inventario-image.env
    printf 'Backend saludable: %s\n' "$image"

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: ${{ (inputs.mode || 'deploy') == 'build' && 'cd-validation' || 'dockerhub' }}
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Validar Compose y Bash
        run: |
          docker compose --env-file .env.example -f docker-compose.aws.yml config --no-env-resolution --quiet
          bash -n <<< "$REMOTE_SCRIPT"

      - name: Autenticar en Docker Hub
        if: (inputs.mode || 'deploy') != 'build'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Construir y publicar según el modo
        id: image
        env:
          MODE: ${{ inputs.mode || 'deploy' }}
        run: |
          args=(--load)
          if [[ "$MODE" != build ]]; then
            args=(--push)
          fi
          metadata="$RUNNER_TEMP/inventario-image.json"
          docker buildx build "${args[@]}" --platform linux/amd64 \
            --tag "$IMAGE:$GITHUB_SHA" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --metadata-file "$metadata" .
          if [[ "$MODE" != build ]]; then
            digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "$metadata")
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            printf 'Imagen publicada: %s:%s (%s)\n' "$IMAGE" "$GITHUB_SHA" "$digest"
          fi

  deploy:
    if: github.ref == 'refs/heads/main' && (inputs.mode || 'deploy') == 'deploy'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Verificar que producción esté habilitada
        env:
          ENABLED: ${{ vars.EC2_DEPLOY_ENABLED }}
        run: |
          if [[ "$ENABLED" != true ]]; then
            echo "::error::El entorno production debe habilitar EC2_DEPLOY_ENABLED para desplegar."
            exit 1
          fi

      - name: Autenticar en AWS mediante OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Actualizar el backend por SSM
        shell: bash
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          release_image="$IMAGE@$DIGEST"
          [[ "$release_image" =~ ^manumorita/api-inventario@sha256:[a-f0-9]{64}$ ]]
          [[ "$EC2_INSTANCE_ID" =~ ^i-([a-f0-9]{8}|[a-f0-9]{17})$ ]]
          compose_sha=$(git show HEAD:docker-compose.aws.yml | sha256sum | cut -d ' ' -f 1)
          [[ "$compose_sha" =~ ^[a-f0-9]{64}$ ]]

          parameters=$(jq -cn \
            --arg command "exec runuser -u ubuntu -- /bin/bash -s -- '$release_image' '$compose_sha' >/dev/null 2>&1" \
            --arg script "$REMOTE_SCRIPT" \
            '{commands: [($command + " <<\u0027DEPLOY_SCRIPT\u0027\n" + $script + "\nDEPLOY_SCRIPT")], executionTimeout: ["600"]}')
          command_id=$(aws ssm send-command \
            --document-name AWS-RunShellScript --instance-ids "$EC2_INSTANCE_ID" \
            --timeout-seconds 60 --parameters "$parameters" \
            --query 'Command.CommandId' --output text)
          printf 'Comando SSM: %s\n' "$command_id"

          deadline=$((SECONDS + 720))
          while (( SECONDS < deadline )); do
            if result=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" \
              --query '[Status, StatusDetails, ResponseCode]' --output text 2>&1); then
              IFS=$'\t' read -r status details code <<< "$result"
              case "$status:$code" in
                Success:0) echo 'Backend actualizado y saludable.'; exit 0 ;;
                Pending:*|InProgress:*|Delayed:*|Cancelling:*) ;;
                *) printf '::error::SSM terminó con estado %s (%s), código %s.\n' "$status" "$details" "$code"; exit 1 ;;
              esac
            elif [[ "$result" != *'(InvocationDoesNotExist)'* ]]; then
              echo '::error::No se pudo consultar el resultado de SSM.'
              exit 1
            fi
            sleep 5
          done
          echo '::error::Se agotó la espera del resultado de SSM.'
          exit 1
