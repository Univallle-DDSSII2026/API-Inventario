name: CI — Integración Continua

# Estructura de la guía del dojo (Paso 13): dos jobs, "Build, Test y Calidad" y "SonarCloud Analysis".
# También corre en los PR hacia main, para que el ruleset de main pueda exigir los mismos checks.
on:
  pull_request:
    branches: [ develop, main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    name: Build, Test y Calidad
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Dar permisos al Gradle wrapper
        run: chmod +x gradlew

      - name: Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Tests unitarios
        run: ./gradlew test

      - name: Tests de integración con Testcontainers
        run: ./gradlew integrationTest

      - name: Generar reporte JaCoCo
        run: ./gradlew jacocoTestReport

      - name: Verificar cobertura >= 80%
        run: ./gradlew jacocoTestCoverageVerification

      - name: Build final
        run: ./gradlew bootJar -x test

      - name: Publicar reporte JaCoCo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: build/reports/jacoco/jacocoTestReport/html
          retention-days: 7

  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # SonarCloud necesita el historial completo para saber qué código es nuevo

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Dar permisos al Gradle wrapper
        run: chmod +x gradlew

      # Se corren también los de integración: sin ellos Sonar mostraría menos cobertura que JaCoCo.
      - name: Generar reporte JaCoCo para SonarCloud
        run: ./gradlew test integrationTest jacocoTestReport

      - name: Análisis SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --no-daemon