# Los valores que cambian por entorno vienen de variables de entorno (ver .env.example; DAS v1.3, Tabla 14).
server:
  port: ${SERVER_PORT}

spring:
  application:
    name: inventario-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      # Flyway crea el esquema; Hibernate solo verifica que coincida con las entidades.
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

inventario:
  notificaciones:
    url: ${NOTIFICACIONES_URL}
    api-key: ${NOTIFICACIONES_API_KEY}

  seguridad:
    # Formato clave:ROL,clave:ROL con los roles FABRICACION, NOTIFICACIONES y EQUIPO (DAS v1.3, Tabla 14).
    api-keys: ${API_KEYS}
    limite-por-minuto: ${RATE_LIMIT_PER_MINUTE}